<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Allô Artisan - Bamako</title>
    <!-- Chargement de Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans pb-12">

    <!-- Magnifique En-tête (Header avec bannière stylisée) -->
    <header class="bg-gradient-to-r from-orange-600 via-orange-500 to-amber-600 text-white shadow-lg pb-6 pt-6 px-4 rounded-b-3xl">
        <div class="max-w-md mx-auto">
            <div class="flex justify-between items-center mb-3">
                <span class="bg-orange-700/60 text-xs font-medium px-3 py-1 rounded-full backdrop-blur-sm border border-orange-400/30">
                     Bamako 
                </span>
                <span class="text-xs bg-white/20 px-2.5 py-1 rounded-full font-semibold">Service Pro</span>
            </div>
            <div class="flex items-center space-x-3">
                <div class="bg-white text-orange-600 p-3 rounded-2xl shadow-md text-2xl font-black">
                    
                </div>
                <div>
                    <h1 class="text-2xl font-extrabold tracking-tight">Allô Artisan</h1>
                    <p class="text-orange-100 text-xs font-medium">Trouvez le bon professionnel près de chez vous</p>
                </div>
            </div>
        </div>
    </header>

    <!-- Contenu Principal -->
    <main class="max-w-md mx-auto p-4 -mt-3">
        
        <!-- Bloc de Recherche et Filtres -->
        <div class="bg-white p-4 rounded-2xl shadow-md border border-slate-100 mb-5 space-y-3">
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1.5">Rechercher un service</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400"></span>
                    <input type="text" id="searchInput" placeholder="Ex: Plombier, Électricien, Moto..." 
                        class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-orange-500 focus:bg-white text-sm transition">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1.5">Quartier</label>
                <select id="quartierFilter" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-orange-500 focus:bg-white text-sm transition font-medium">
                    <option value="">Tous les quartiers de Bamako</option>
                    <option value="Badalabougou">Badalabougou</option>
                    <option value="Kalaban Coro">Kalaban Coro</option>
                    <option value="ACI 2000">ACI 2000</option>
                    <option value="Hamdallaye">Hamdallaye</option>
                    <option value="Sotuba">Sotuba</option>
                </select>
            </div>
        </div>

        <!-- Titre de section -->
        <div class="flex justify-between items-center mb-3 px-1">
            <h2 class="text-sm font-bold text-slate-600 uppercase tracking-wider">Professionnels disponibles</h2>
            <span id="countBadge" class="text-xs bg-orange-100 text-orange-700 font-bold px-2.5 py-0.5 rounded-full">0</span>
        </div>

        <!-- Liste des Artisans -->
        <div id="artisanList" class="space-y-3.5">
            <!-- Injecté dynamiquement par JavaScript -->
        </div>

    </main>

    <!-- Script de gestion -->
    <script>
        const artisans = [
            {
                nom: "Moussa Traoré",
                metier: "Plombier",
                quartier: "Badalabougou",
                note: "4.8",
                tel: "+22370000001",
                photo: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150"
            },
            {
                nom: "Oumar Coulibaly",
                metier: "Électricien",
                quartier: "Kalaban Coro",
                note: "4.9",
                tel: "+22371111102",
                photo: "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=150"
            },
            {
                nom: "Sekou Diallo",
                metier: "Moto-Taxi / Livreur",
                quartier: "ACI 2000",
                note: "4.7",
                tel: "+22372222203",
                photo: "https://images.unsplash.com/photo-1492562080023-ab3db95bfbce?w=150"
            },
            {
                nom: "Fatoumata Sidibé",
                metier: "Couturière / Tailleur",
                quartier: "Hamdallaye",
                note: "5.0",
                tel: "+22373333304",
                photo: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150"
            }
        ];

        const artisanList = document.getElementById('artisanList');
        const searchInput = document.getElementById('searchInput');
        const quartierFilter = document.getElementById('quartierFilter');
        const countBadge = document.getElementById('countBadge');

        function displayArtisans(data) {
            artisanList.innerHTML = '';
            countBadge.textContent = data.length;

            if (data.length === 0) {
                artisanList.innerHTML = `
                    <div class="bg-white p-8 rounded-2xl text-center border border-slate-100 shadow-sm">
                        <p class="text-3xl mb-2"></p>
                        <p class="text-slate-600 font-semibold text-sm">Aucun artisan trouvé</p>
                        <p class="text-slate-400 text-xs mt-1">Essayez un autre mot-clé ou quartier.</p>
                    </div>`;
                return;
            }

            data.forEach(artisan => {
                const card = document.createElement('div');
                card.className = "bg-white p-4 rounded-2xl shadow-sm flex items-center justify-between border border-slate-100 hover:shadow-md transition";
                
                card.innerHTML = `
                    <div class="flex items-center space-x-3.5">
                        <img src="${artisan.photo}" alt="${artisan.nom}" class="w-15 h-15 w-16 h-16 rounded-2xl object-cover shadow-sm border-2 border-orange-500">
                        <div>
                            <h3 class="font-bold text-base text-slate-900">${artisan.nom}</h3>
                            <p class="text-xs text-orange-600 font-bold uppercase tracking-wide mt-0.5">${artisan.metier}</p>
                            <p class="text-xs text-slate-400 mt-1 flex items-center">
                                <span class="mr-1"></span> ${artisan.quartier}
                            </p>
                            <div class="flex items-center text-xs text-amber-500 font-bold mt-1">
                                <span class="mr-1"></span><span>${artisan.note}</span>
                            </div>
                        </div>
                    </div>
                    <div class="flex flex-col space-y-2">
                        <a href="tel:${artisan.tel}" class="bg-emerald-600 text-white w-11 h-11 rounded-xl flex items-center justify-center shadow-md hover:bg-emerald-700 transition text-lg" title="Appeler">
                            
                        </a>
                        <a href="https://wa.me/${artisan.tel}?text=Bonjour%20${artisan.nom},%20je%20vous%20contacte%20via%20Allô%20Artisan." target="_blank" class="bg-green-500 text-white w-11 h-11 rounded-xl flex items-center justify-center shadow-md hover:bg-green-600 transition text-lg" title="WhatsApp">
                            
                        </a>
                    </div>
                `;
                artisanList.appendChild(card);
            });
        }

        function filterArtisans() {
            const searchVal = searchInput.value.toLowerCase();
            const quartierVal = quartierFilter.value;

            const filtered = artisans.filter(a => {
                const matchSearch = a.nom.toLowerCase().includes(searchVal) || a.metier.toLowerCase().includes(searchVal);
                const matchQuartier = quartierVal === "" || a.quartier === quartierVal;
                return matchSearch && matchQuartier;
            });

            displayArtisans(filtered);
        }

        searchInput.getElementById ? null : searchInput.addEventListener('input', filterArtisans);
        searchInput.addEventListener('input', filterArtisans);
        quartierFilter.addEventListener('change', filterArtisans);

        displayArtisans(artisans);
    </script>
</body>
</html>
